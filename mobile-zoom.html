<!--
  作者：宿鹏翔
  学号：24002120405
  建立时间：2026-11-25
  使用大模型：DeepSeek-V4.1-Flash
  功能名称：移动端图片查看器（双指缩放 1x~4x · 双击 1x⇄2x · 放大后单指拖动 · 缩回 1x 自动居中）

  ═══════════════════════════════════════════════════════════════════
  答辩准备 · 任务 7：如何保证"缩放不跳"？
  ───────────────────────────────────────────────────────────────────
  核心算法：锚点坐标保持法（Anchor Keeping）

  双指缩放时，手指下的图片像素点在屏幕上的位置，
  必须在缩放前后保持一致——否则用户就会觉得"跳了"。

  步骤：
  ① touchstart 记录双指中点在【舞台坐标系】的位置 (cx, cy)
  ② 把它换算成【图片坐标系】：
       ix = (cx - tx0) / s0    // 图片上的像素位置，与 scale 无关
       iy = (cy - ty0) / s0
  ③ touchmove 算出新的 scale = s1 之后，反推新的 translate：
       tx1 = cx - ix * s1
       ty1 = cy - iy * s1
  ④ 用 (tx1, ty1, s1) 做 transform

  结果：两指按住的那个像素，在缩放前后始终落在 (cx, cy)，
  手指感受到的是"原地放大"，没有漂移——这就是"不跳"的秘密。

  同理，双击 1x→2x 时，以双击点 (dx, dy) 为锚：
  ix = (dx - 0) / 1 = dx
  tx_new = dx - ix * 2 = -dx
  这样图片以双击点为中心展开，视觉上也不跳。
  ═══════════════════════════════════════════════════════════════════
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>图片查看器 · 宿鹏翔 24002120405</title>
<style>
  /* 宿鹏翔：基础重置 */
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #1a1a2e;
    color: #eee;
    min-height: 100vh;
    padding: 16px;
  }

  /* 宿鹏翔：标题 */
  .spx_title { text-align: center; margin-bottom: 16px; }
  .spx_title h1 { font-size: 18px; letter-spacing: 2px; color: #ffd166; }
  .spx_title p { font-size: 12px; color: #9ca3af; margin-top: 4px; }

  /* 宿鹏翔：2. 图片查看器容器 */
  .spx_viewer {
    width: 100%;
    max-width: 400px;
    height: 500px;
    margin: 0 auto;
    background: #0f0f23;
    border-radius: 14px;
    overflow: hidden;           /* 宿鹏翔：要求 ① overflow:hidden */
    touch-action: none;         /* 宿鹏翔：要求 ① 阻止浏览器默认手势，全部自己接管 */
    user-select: none;          /* 宿鹏翔：要求 ① 禁选 */
    position: relative;
    box-shadow: 0 12px 32px rgba(0,0,0,.5);
  }

  /* 宿鹏翔：图片 track —— transform 统一承担 translate + scale */
  .spx_img {
    position: absolute;
    left: 50%;
    top: 50%;
    transform-origin: 0 0;      /* 锚点保持算法的基础：origin 设为 (0,0) */
    transition: transform .25s cubic-bezier(.22,.61,.36,1);   /* 宿鹏翔：5. 双击过渡 0.25s */
    will-change: transform;
  }
  /* 宿鹏翔：拖动/缩放中移除 transition，让手势跟手 */
  .spx_viewer.spx_interacting .spx_img { transition: none; }

  /* 宿鹏翔：缩放倍率角标 */
  .spx_badge {
    position: absolute;
    top: 12px; right: 12px;
    background: rgba(0,0,0,.7);
    color: #ffd166;
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 999px;
    z-index: 10;
    pointer-events: none;
  }

  /* 宿鹏翔：手机端提示 —— 6. */
  .spx_hint {
    text-align: center;
    margin-top: 20px;
    font-size: 12px;
    color: #ffd166;
    background: rgba(255,209,102,.12);
    border: 1px solid rgba(255,209,102,.3);
    padding: 10px 16px;
    border-radius: 8px;
    max-width: 400px;
    margin-left: auto;
    margin-right: auto;
    line-height: 1.8;
  }
  .spx_hint b { color: #fff; }

  /* 宿鹏翔：桌面端额外提示（因为鼠标没有触摸） */
  @media (hover: hover) and (pointer: fine) {
    .spx_hint::before {
      content: '⚠️ ';
    }
    .spx_hint b::after {
      content: '（或用 DevTools 设备模式）';
    }
  }
</style>
</head>
<body>

<div class="spx_title">
  <h1>🔍 图片查看器</h1>
  <p>宿鹏翔 · 24002120405 · 双指缩放 / 双击切换</p>
</div>

<!-- 宿鹏翔：2. 图片查看器容器 -->
<div class="spx_viewer" id="spx_viewer">
  <span class="spx_badge" id="spx_badge">1.0x</span>
  <!-- 宿鹏翔：大图（横向 16:9） -->
  <img class="spx_img" id="spx_img"
       src="https://picsum.photos/seed/viewer/1280/720"
       alt="风景大图">
</div>

<!-- 宿鹏翔：6. 提示文字 -->
<div class="spx_hint">
  <b>双指缩放请用手机打开</b><br>
  双指捏合 → 1x~4x 任意倍率 · 双击 → 1x ⇄ 2x · 放大后单指拖动看细节
</div>

<script>
  // ══════════════════════════════════════════════════════════
  //  宿鹏翔：任务三 · 图片查看器（变量全 spx_ 开头）
  // ══════════════════════════════════════════════════════════

  // 宿鹏翔：DOM 引用
  const SPX_VIEWER = document.getElementById('spx_viewer');
  const SPX_IMG    = document.getElementById('spx_img');
  const SPX_BADGE  = document.getElementById('spx_badge');

  // 宿鹏翔：当前图片显示尺寸（初始未缩放时）
  const SPX_STAGE_W = 400;   // 容器宽
  const SPX_STAGE_H = 500;   // 容器高

  // 宿鹏翔：运行时状态
  let spx_tx = 0, spx_ty = 0;   // 当前平移（图片相对 transform-origin 的位置）
  let spx_scale = 1;           // 当前缩放倍率（1 ~ 4）
  const SPX_MIN = 1, SPX_MAX = 4;

  // 宿鹏翔：双击判定用（两次 touchend 间隔 < 300ms 且位移 < 20px）
  let spx_lastTapTime = 0;
  let spx_lastTapX = 0, spx_lastTapY = 0;

  // ══════════════════════════════════════════════════════════
  //  宿鹏翔：工具函数 —— 更新 transform 并同步倍率角标
  // ══════════════════════════════════════════════════════════
  function spx_applyTransform() {
    SPX_IMG.style.transform =
      'translate(' + spx_tx + 'px, ' + spx_ty + 'px) scale(' + spx_scale + ')';
    SPX_BADGE.textContent = spx_scale.toFixed(1) + 'x';
  }

  // ══════════════════════════════════════════════════════════
  //  宿鹏翔：工具函数 —— 边界夹紧（单指拖动松手时用）
  //  图片放大后宽/高 = rawW * spx_scale, rawH * spx_scale
  //  tx 允许范围：-(imgW - stageW) / 2 ~ (imgW - stageW) / 2
  //  让图片边缘永远不进入舞台可见区
  // ══════════════════════════════════════════════════════════
  function spx_clampTxY() {
    // 宿鹏翔：图片原生尺寸未知，直接用 current 计算（浏览器已算出渲染尺寸）
    var spx_imgW = SPX_IMG.clientWidth * spx_scale;
    var spx_imgH = SPX_IMG.clientHeight * spx_scale;
    var spx_maxX = Math.max(0, (spx_imgW - SPX_STAGE_W) / 2);
    var spx_maxY = Math.max(0, (spx_imgH - SPX_STAGE_H) / 2);
    spx_tx = Math.max(-spx_maxX, Math.min(spx_maxX, spx_tx));
    spx_ty = Math.max(-spx_maxY, Math.min(spx_maxY, spx_ty));
  }

  // ══════════════════════════════════════════════════════════
  //  宿鹏翔：工具函数 —— 重置（缩回 1x 自动居中）
  // ══════════════════════════════════════════════════════════
  function spx_reset() {
    spx_scale = 1;
    spx_tx = 0;
    spx_ty = 0;
    spx_applyTransform();
  }

  // ══════════════════════════════════════════════════════════
  //  宿鹏翔：2. touchstart —— 记录单指/双指状态
  // ══════════════════════════════════════════════════════════

  // 宿鹏翔：当前模式 —— 'pan'（单指拖动） / 'pinch'（双指缩放） / null
  let spx_mode = null;

  // 宿鹏翔：双指缩放的起始锚点（图片坐标系）
  let spx_pinStartDist = 0;   // 两指初始距离
  let spx_pinStartScale = 1;  // 起始 scale
  let spx_pinAnchorImgX = 0;  // 锚点在图片坐标系的 x
  let spx_pinAnchorImgY = 0;  // 锚点在图片坐标系的 y
  let spx_pinStartTx = 0, spx_pinStartTy = 0;  // 起始 translate

  // 宿鹏翔：单指拖动的起点（舞台坐标系）
  let spx_panStartX = 0, spx_panStartY = 0;
  let spx_panStartTx = 0, spx_panStartTy = 0;

  SPX_VIEWER.addEventListener('touchstart', function(e){
    SPX_VIEWER.classList.add('spx_interacting');  // 宿鹏翔：触摸期间移除 transition

    if (e.touches.length === 2) {
      // 宿鹏翔：双指 —— 进入 pinch 模式
      spx_mode = 'pinch';
      var t0 = e.touches[0], t1 = e.touches[1];
      // 2. 记录两指初始距离
      spx_pinStartDist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
      spx_pinStartScale = spx_scale;
      // 两指中点（舞台坐标系，相对于容器左上角）
      var cx = (t0.clientX + t1.clientX) / 2 - SPX_VIEWER.getBoundingClientRect().left;
      var cy = (t0.clientY + t1.clientY) / 2 - SPX_VIEWER.getBoundingClientRect().top;
      // ══════════════════════════════════════════════════════════
      //  答辩关键点 —— 锚点保持算法（步骤 ①②）
      //  把舞台坐标 (cx, cy) 换算成【图片坐标系】的锚点：
      //  ix = (cx - tx0) / s0
      //  这样图片上的这个像素位置就与 scale 解耦了，
      //  后续 touchmove 只需要反算新的 tx1 = cx - ix * s1 即可
      // ══════════════════════════════════════════════════════════
      spx_pinAnchorImgX = (cx - spx_tx) / spx_scale;
      spx_pinAnchorImgY = (cy - spx_ty) / spx_scale;
      spx_pinStartTx = spx_tx;
      spx_pinStartTy = spx_ty;
    }
    else if (e.touches.length === 1 && spx_scale > 1) {
      // 宿鹏翔：单指且 scale > 1 —— 进入 pan 模式（拖动看细节）
      spx_mode = 'pan';
      spx_panStartX = e.touches[0].clientX - SPX_VIEWER.getBoundingClientRect().left;
      spx_panStartY = e.touches[0].clientY - SPX_VIEWER.getBoundingClientRect().top;
      spx_panStartTx = spx_tx;
      spx_panStartTy = spx_ty;
    }
    // 单指且 scale === 1 时，不需要 pan，等 touchend 判定双击即可
  }, { passive: true });

  // ══════════════════════════════════════════════════════════
  //  宿鹏翔：3 & 4. touchmove —— 双指缩放 / 单指拖动
  // ══════════════════════════════════════════════════════════
  SPX_VIEWER.addEventListener('touchmove', function(e){
    if (spx_mode === 'pinch' && e.touches.length === 2) {
      // 宿鹏翔：3. 双指缩放 —— 按距离比例 clamp 1~4
      var t0 = e.touches[0], t1 = e.touches[1];
      var d_now = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
      // 新 scale = 起始 scale × (当前距离 / 起始距离)
      var s1 = spx_pinStartScale * (d_now / spx_pinStartDist);
      s1 = Math.max(SPX_MIN, Math.min(SPX_MAX, s1));   // clamp 1~4
      // ══════════════════════════════════════════════════════════
      //  答辩关键点 —— 锚点保持算法（步骤 ③）
      //  反推新 translate：让锚点 (ix, iy) 仍落在屏幕 (cx, cy)
      //  tx1 = cx - ix * s1，ty1 同理
      // ══════════════════════════════════════════════════════════
      var cx = (t0.clientX + t1.clientX) / 2 - SPX_VIEWER.getBoundingClientRect().left;
      var cy = (t0.clientY + t1.clientY) / 2 - SPX_VIEWER.getBoundingClientRect().top;
      spx_scale = s1;
      spx_tx = cx - spx_pinAnchorImgX * s1;
      spx_ty = cy - spx_pinAnchorImgY * s1;
      spx_applyTransform();
    }
    else if (spx_mode === 'pan' && e.touches.length === 1) {
      // 宿鹏翔：4. 单指拖动 —— 更新 tx/ty（松手后再边界夹紧）
      var nowX = e.touches[0].clientX - SPX_VIEWER.getBoundingClientRect().left;
      var nowY = e.touches[0].clientY - SPX_VIEWER.getBoundingClientRect().top;
      spx_tx = spx_panStartTx + (nowX - spx_panStartX);
      spx_ty = spx_panStartTy + (nowY - spx_panStartY);
      spx_applyTransform();
    }
  }, { passive: true });

  // ══════════════════════════════════════════════════════════
  //  宿鹏翔：touchend —— 收尾 + 双击判定 + 边界夹紧 + 缩回 1x 自动居中
  // ══════════════════════════════════════════════════════════
  SPX_VIEWER.addEventListener('touchend', function(e){
    SPX_VIEWER.classList.remove('spx_interacting');
    spx_mode = null;

    // 宿鹏翔：边界夹紧（只在 scale > 1 时有意义）
    if (spx_scale > 1) spx_clampTxY();

    // 宿鹏翔：缩回 1x 自动居中
    if (spx_scale <= 1.02) {
      spx_reset();
    } else {
      spx_applyTransform();
    }

    // 宿鹏翔：5. 双击判定 —— 两次 touchend 间隔 < 300ms 且位移 < 20px
    var now = Date.now();
    var cx_now = e.changedTouches[0].clientX - SPX_VIEWER.getBoundingClientRect().left;
    var cy_now = e.changedTouches[0].clientY - SPX_VIEWER.getBoundingClientRect().top;
    if (now - spx_lastTapTime < 300 &&
        Math.abs(cx_now - spx_lastTapX) < 20 &&
        Math.abs(cy_now - spx_lastTapY) < 20) {
      // ══════════════════════════════════════════════════════════
      //  双击缩放 —— 同样用锚点保持，以双击点为中心展开
      // ══════════════════════════════════════════════════════════
      SPX_VIEWER.classList.add('spx_interacting');  // 先移除跟手 transition，等 apply 完再加回去

      if (spx_scale > 1.02) {
        // 缩回 1x
        spx_reset();
      } else {
        // 放大到 2x，以双击点 (cx_now, cy_now) 为锚
        var ix = (cx_now - spx_tx) / spx_scale;   // 当前 scale=1，等价于 ix = cx_now
        var iy = (cy_now - spx_ty) / spx_scale;
        spx_scale = 2;
        spx_tx = cx_now - ix * 2;
        spx_ty = cy_now - iy * 2;
        spx_applyTransform();
        spx_clampTxY();
        spx_applyTransform();
      }

      // 宿鹏翔：5. 0.25s 过渡
      setTimeout(function(){
        SPX_VIEWER.classList.remove('spx_interacting');
      }, 10);

      // 重置上次 tap 记录，避免连按连续触发
      spx_lastTapTime = 0;
      return;
    }

    // 更新上次 tap
    spx_lastTapTime = now;
    spx_lastTapX = cx_now;
    spx_lastTapY = cy_now;
  });

  // ══════════════════════════════════════════════════════════
  //  宿鹏翔：初始化
  // ══════════════════════════════════════════════════════════
  spx_reset();
</script>
</body>
</html>
