<!DOCTYPE html>
<!-- 姓名：宿鹏翔 | 学号：24002120405 | 时间：2026-11-25 | 大模型：DeepSeek-V4.1-Flash -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="宿鹏翔（24002120405）知识库问答页：上传 DOC/DOCX/PPTX/PDF/TXT 构建专属知识库，基于检索增强生成（RAG）回答问题。" />
  <title>知识库问答 | 宿鹏翔</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23a78bfa'/%3E%3Cstop offset='1' stop-color='%2360a5fa'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='16' font-weight='bold' text-anchor='middle' fill='%23060a14'%3ES%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/spx_kb.css" />
</head>
<body>
  <main class="spx_wrap">
    <a class="spx_back" href="index.html">← 返回首页</a>

    <header class="spx_header">
      <p class="spx_tag">RAG 知识库</p>
      <h1 class="spx_title">知识库问答客服</h1>
      <p class="spx_subtitle">上传门店文档构建专属知识库，先检索资料再让大模型作答，答案附参考来源。</p>

      <div class="spx_api-bar">
        <span class="spx_api-label">接口地址</span>
        <code class="spx_api-value">POST /api/kb/ask</code>
        <span class="spx_api-full" id="spx_apiFull"></span>
      </div>

      <div class="spx_provider">
        <label class="spx_provider-label" for="spx_providerSelect">模型平台</label>
        <select class="spx_provider-select" id="spx_providerSelect">
          <option value="siliconflow">硅基流动</option>
          <option value="qiniu">七牛云</option>
        </select>
      </div>
    </header>

    <!-- 知识库文件上传 -->
    <section class="spx_card">
      <div class="spx_card-head">
        <h2 class="spx_card-title">1. 知识库文件上传</h2>
        <p class="spx_stats" id="spx_stats">文件 0 个 · 片段 0 条</p>
      </div>

      <div class="spx_drop" id="spx_dropZone" tabindex="0">
        <p class="spx_drop-main">点击选择或拖拽文件到此处</p>
        <p class="spx_drop-tip">支持 doc / docx / ppt / pptx / pdf / txt / md，单个文件不超过 10MB</p>
        <input type="file" id="spx_fileInput" accept=".doc,.docx,.ppt,.pptx,.pdf,.txt,.md" hidden />
      </div>
      <p class="spx_upload-tip" id="spx_uploadTip"></p>

      <!-- 知识库文件列表 -->
      <ul class="spx_file-list" id="spx_fileList"></ul>
    </section>

    <!-- 基于知识库的问答 -->
    <section class="spx_card">
      <h2 class="spx_card-title">2. 基于知识库提问</h2>

      <div class="spx_quick" id="spx_quickList">
        <button class="spx_quick-item" type="button">你们几点营业？</button>
        <button class="spx_quick-item" type="button">配送范围是多远？</button>
        <button class="spx_quick-item" type="button">停车怎么收费？</button>
      </div>

      <div class="spx_ask-row">
        <input class="spx_ask-input" id="spx_question" type="text" maxlength="500"
          placeholder="输入与门店相关的问题，例如：会员日有什么优惠？" />
        <button class="spx_ask-btn" id="spx_askBtn" type="button">提问</button>
      </div>

      <div class="spx_answer" id="spx_answer" hidden>
        <p class="spx_answer-label">客服回答</p>
        <p class="spx_answer-text" id="spx_answerText"></p>
        <p class="spx_answer-meta" id="spx_answerMeta"></p>
        <div class="spx_refs" id="spx_refs"></div>
      </div>
    </section>

    <footer class="spx_footer">宿鹏翔 · 24002120405</footer>
  </main>

  <script src="js/spx_kb.js"></script>
</body>
</html>
