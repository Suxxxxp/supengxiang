<!--
  作者：宿鹏翔
  建立时间：2026-11-04
  使用大模型：DeepSeek-V4.1-Flash
  功能名称：新闻 Tab 选项卡切换
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab 选项卡</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background: #f5f6f8;
            color: #333;
            padding: 40px 16px;
        }

        .page-title {
            max-width: 760px;
            margin: 0 auto 20px;
            font-size: 22px;
        }

        /* 选项卡整体容器 */
        .tabs {
            max-width: 760px;
            margin: 0 auto;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, .08);
            overflow: hidden;
        }

        /* 选项按钮栏 */
        .tab-nav {
            display: flex;
            border-bottom: 1px solid #e6e8eb;
            background: #fafbfc;
        }

        .tab-btn {
            flex: 1;
            padding: 14px 8px;
            border: none;
            background: transparent;
            font-size: 16px;
            color: #666;
            cursor: pointer;
            transition: color .2s, background .2s;
        }

        .tab-btn:hover {
            color: #1a73e8;
            background: #f0f4ff;
        }

        /* 当前选中状态 */
        .tab-btn.active {
            color: #1a73e8;
            font-weight: bold;
            background: #fff;
            box-shadow: inset 0 -2px 0 #1a73e8;
        }

        .tab-body {
            padding: 24px;
        }

        /* 内容面板默认隐藏，选中后才显示 */
        .tab-panel {
            display: none;
            line-height: 1.9;
        }

        .tab-panel.active {
            display: block;
        }

        .tab-panel h3 {
            margin-bottom: 12px;
            font-size: 18px;
            color: #1a73e8;
        }

        .tab-panel li {
            margin-bottom: 8px;
            list-style: none;
            padding-left: 16px;
            position: relative;
        }

        .tab-panel li::before {
            content: "•";
            position: absolute;
            left: 0;
            color: #1a73e8;
        }

        @media (max-width: 480px) {
            .tab-btn {
                font-size: 14px;
                padding: 12px 4px;
            }
        }
    </style>
</head>
<body>
    <h1 class="page-title">新闻中心</h1>

    <!-- 选项卡容器：data-target 与下方面板 id 一一对应，结构可整体复制复用 -->
    <div class="tabs" id="news-tabs">
        <div class="tab-nav">
            <button type="button" class="tab-btn" data-target="panel-domestic">国内新闻</button>
            <button type="button" class="tab-btn" data-target="panel-province">省内新闻</button>
            <!-- 国际新闻为默认选项 -->
            <button type="button" class="tab-btn active" data-target="panel-world">国际新闻</button>
            <button type="button" class="tab-btn" data-target="panel-hot">最热新闻</button>
        </div>

        <div class="tab-body">
            <section class="tab-panel" id="panel-domestic">
                <h3>国内新闻</h3>
                <ul>
                    <li>全国多地推进城市老旧小区改造，居民居住条件持续改善。</li>
                    <li>国内新能源汽车产销量继续保持增长态势。</li>
                </ul>
            </section>

            <section class="tab-panel" id="panel-province">
                <h3>省内新闻</h3>
                <ul>
                    <li>省内重点交通项目进入施工收尾阶段，年内有望通车。</li>
                    <li>省文旅部门推出秋季主题旅游线路，覆盖多个特色景区。</li>
                </ul>
            </section>

            <section class="tab-panel active" id="panel-world">
                <h3>国际新闻</h3>
                <ul>
                    <li>多国代表就全球气候变化议题展开新一轮磋商。</li>
                    <li>国际航运市场运价出现阶段性波动，各方密切关注。</li>
                </ul>
            </section>

            <section class="tab-panel" id="panel-hot">
                <h3>最热新闻</h3>
                <ul>
                    <li>本周热门话题：人工智能应用加速进入日常生活场景。</li>
                    <li>体育赛事精彩收官，相关话题阅读量持续攀升。</li>
                </ul>
            </section>
        </div>
    </div>

    <!-- 选项卡逻辑单独放在 js 文件夹中，外部引用 -->
    <script src="./js/tab.js"></script>
</body>
</html>
